<title>Family Night Guest Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout: a control rail (screen + night state + "host starts a night") beside one 360px phone with app bar and bottom nav. Dark-only, like the FNH app and the owner-portal mockups. */
:root{
  --bg:oklch(0.135 0.004 70); --fg:oklch(0.97 0.004 85); --card:oklch(0.175 0.005 70);
  --muted:oklch(0.22 0.005 70); --mfg:oklch(0.72 0.01 80); --line:oklch(1 0 0 / 9%);
  --bar:oklch(0.155 0.004 70);
  --cinema:oklch(0.72 0.18 38); --cinema-ink:oklch(0.16 0.02 40); --cinema-soft:oklch(0.72 0.18 38 / 14%);
  --warn:oklch(0.8 0.14 85); --ok:oklch(0.75 0.13 155);
  --sans:"Geist",ui-sans-serif,system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-size:14px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid oklch(0.72 0.18 38 / 60%);outline-offset:2px}
.wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start;max-width:1100px;margin:0 auto}
.rail{flex:1 1 300px;max-width:420px;display:flex;flex-direction:column;gap:18px;min-width:0}
.rail h1{font-size:18px;margin:0;font-weight:600}
.rail p{margin:0;color:var(--mfg);line-height:1.5}
.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mfg);margin:0 0 8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);padding:7px 10px;border-radius:9px;color:var(--mfg);font-size:13px}
.seg button[aria-pressed=true]{background:var(--muted);color:var(--fg);border-color:oklch(1 0 0 / 22%)}
.sim{border:1px dashed oklch(0.72 0.18 38 / 50%);background:var(--cinema-soft);color:var(--fg);border-radius:10px;padding:10px 12px;font-weight:500;text-align:left}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.5;color:var(--mfg)}
.note b{color:var(--fg)}
.note code{font-family:var(--mono);font-size:12px;color:var(--fg)}
/* phone */
.phone{width:360px;max-width:100%;height:740px;border:1px solid var(--line);border-radius:22px;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg);position:relative;flex:none}
.appbar{display:flex;align-items:center;gap:8px;height:56px;padding:0 12px 0 14px;border-bottom:1px solid var(--line);background:var(--bar)}
.appbar .back{border:0;background:none;color:var(--mfg);font-size:22px;padding:0 4px;height:40px}
.appbar b{font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:20px;height:36px;padding:0 10px 0 4px;font-size:13px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex:none}
.main{overflow:auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:18px}
.nav{display:flex;border-top:1px solid var(--line);background:var(--bar)}
.nav button{flex:1;height:58px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mfg);position:relative}
.nav button[aria-current=page]{color:var(--fg)}
.nav svg{width:21px;height:21px}
.dot{position:absolute;top:9px;left:calc(50% + 7px);width:8px;height:8px;border-radius:50%;background:var(--cinema);box-shadow:0 0 0 2px var(--bar)}
h2{font-size:26px;font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance}
h3{font-size:16px;font-weight:600;margin:0}
.sub{color:var(--mfg);margin:0;line-height:1.45}
.btn{border:0;border-radius:12px;height:56px;width:100%;font-weight:600;font-size:16px;background:var(--muted);color:var(--fg)}
.btn.primary{background:var(--cinema);color:var(--cinema-ink)}
.btn.sm{height:40px;font-size:14px;width:auto;padding:0 14px;font-weight:500}
.link{background:none;border:0;color:var(--fg);text-decoration:underline;text-underline-offset:4px;padding:0;font-size:14px;text-align:left}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.tonight{border-color:oklch(0.72 0.18 38 / 35%);background:linear-gradient(180deg,oklch(0.72 0.18 38 / 10%),transparent 60%),var(--card)}
.tonight.wait{border-color:var(--line);background:var(--card)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mfg)}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--cinema)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--cinema);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:11px;font-weight:600;background:var(--cinema);color:var(--cinema-ink);letter-spacing:0;text-transform:none}
.row{display:flex;gap:14px;align-items:flex-start}
.poster{width:72px;aspect-ratio:2/3;border-radius:8px;flex:none;display:grid;place-items:end start;padding:5px;font-size:9px;font-weight:600;line-height:1.1;max-width:100%}
.p1{background:linear-gradient(160deg,oklch(0.55 0.13 230),oklch(0.28 0.08 280))}
.p2{background:linear-gradient(160deg,oklch(0.6 0.14 140),oklch(0.3 0.07 170))}
.p3{background:linear-gradient(160deg,oklch(0.62 0.16 30),oklch(0.3 0.09 10))}
.p4{background:linear-gradient(160deg,oklch(0.6 0.12 300),oklch(0.3 0.08 330))}
.p5{background:linear-gradient(160deg,oklch(0.7 0.12 85),oklch(0.35 0.07 60))}
.clap{width:72px;aspect-ratio:2/3;border-radius:8px;background:var(--muted);display:grid;place-items:center;font-size:26px;flex:none}
.here{display:flex;align-items:center;gap:10px;color:var(--mfg);font-size:13px}
.avs{display:flex}.avs span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;margin-right:-7px;border:2px solid var(--card)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.night{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;width:100%;color:var(--fg)}
.night .poster{width:54px}
.night .b{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.night .t{font-weight:600;font-size:15px}
.night small{color:var(--mfg)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.f{font-size:12px;border:1px solid var(--line);border-radius:10px;padding:2px 8px;color:var(--mfg)}
.f.won{color:var(--cinema);border-color:oklch(0.72 0.18 38 / 40%)}
.f.rate{background:var(--muted);color:var(--fg);border-color:transparent}
.sec{display:flex;align-items:baseline;justify-content:space-between}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.photos span{aspect-ratio:1;border-radius:8px;max-width:100%}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{height:44px;border:0;border-radius:9px;background:none;color:var(--mfg);font-weight:500}
.tabs button[aria-selected=true]{background:var(--muted);color:var(--fg)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stats dt{font-size:12px;color:var(--mfg)}.stats dd{margin:4px 0 0;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:6px}
.stars button{flex:1;height:56px;border-radius:12px;border:1px solid var(--line);background:var(--muted);font-size:24px;color:var(--mfg)}
.stars button.on{background:var(--cinema-soft);color:var(--cinema);border-color:oklch(0.72 0.18 38 / 45%)}
.handoff{background:var(--cinema-soft);border:1px solid oklch(0.72 0.18 38 / 45%);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;animation:slide .35s ease-out}
.handoff .row{align-items:center}
.handoff .clap,.handoff .poster{width:44px}
@keyframes slide{from{transform:translateY(-8px);opacity:.3}}
.big-av{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:50px;position:relative;flex:none}
.big-av button{position:absolute;right:-4px;bottom:-4px;width:36px;height:36px;border-radius:50%;border:2px solid var(--bg);background:var(--muted);font-size:14px}
.hr{height:1px;background:var(--line)}
.res{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:10px;font-size:13px}
.bar span:first-child{width:110px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar i{height:10px;border-radius:5px;background:var(--muted);flex:1;position:relative;overflow:hidden}
.bar i b{position:absolute;inset:0 auto 0 0;background:var(--mfg)}
.bar.win i b{background:var(--cinema)}
.bar em{font-style:normal;color:var(--mfg);width:24px;text-align:right;font-variant-numeric:tabular-nums}
/* sheets */
.scrim{position:absolute;inset:0;background:oklch(0 0 0 / 55%);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:1px solid var(--line);background:var(--muted);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;min-height:96px}
.tile small{color:var(--mfg);font-size:11px}
.tile.cur{border-color:oklch(0.72 0.18 38 / 50%)}
.dots{display:flex;gap:12px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mfg)}
.dots i.on{background:var(--fg);border-color:var(--fg)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:64px;border-radius:12px;border:0;background:var(--muted);font-size:22px;font-weight:500}
.toast{position:absolute;left:12px;right:12px;top:64px;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px;z-index:6;animation:slide .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div class="wrap">
  <section class="rail" aria-label="Mockup controls">
    <div>
      <h1>Guest home: clickable mockup</h1>
      <p>Issue #58. A signed-in phone at 360px. Use the nav inside the phone like the real app, or jump with the controls. Spec: <code style="font-family:var(--mono);font-size:12px">guest-home.md</code>.</p>
    </div>
    <div><p class="lbl">Screen</p><div class="seg" id="screens"></div></div>
    <div><p class="lbl">The household's night</p><div class="seg" id="states"></div></div>
    <button class="sim" id="simulate" type="button">▶ The host starts a new movie night (watch the phone)</button>
    <div class="note" id="explain"></div>
  </section>
  <div class="phone" id="phone" aria-label="Phone mockup, 360px"></div>
</div>

<script>
const ME={name:"RooDog",emoji:"🦊",color:"oklch(0.55 0.15 50)"};
const FAMILY=[ME,{name:"Mom",emoji:"🌻",color:"oklch(0.55 0.12 95)"},{name:"Dad",emoji:"🐻",color:"oklch(0.45 0.08 60)"},{name:"Lulu",emoji:"🦄",color:"oklch(0.55 0.15 330)"},{name:"Abuela",emoji:"🌵",color:"oklch(0.5 0.12 150)"},{name:"Tío Beto",emoji:"🎸",color:"oklch(0.5 0.13 260)"}];
const NIGHTS=[
  {id:"n5",title:"Paddington 2",date:"Fri, Oct 17",p:"p3",picks:["Paddington 2","Wall-E","Coco"],won:true,rated:null,photos:6,turnout:6,avg:"4.6"},
  {id:"n4",title:"Spirited Away",date:"Fri, Oct 10",p:"p1",picks:["Moana","Spirited Away","Up"],won:false,rated:5,photos:3,turnout:5,avg:"4.8"},
  {id:"n3",title:"The Goonies",date:"Sat, Oct 4",p:"p5",picks:["The Goonies","Hook","Holes"],won:true,rated:4,photos:0,turnout:6,avg:"4.1"},
  {id:"n2",title:"Encanto",date:"Fri, Sep 26",p:"p2",picks:["Zootopia","Frozen","Encanto"],won:false,rated:3,photos:9,turnout:4,avg:"3.9"},
];
const STATES=[
  ["T0","No night"],["T1","Draft"],["T2","Voting"],["T3","Voted, shared phone"],["T4","Voted"],["T5","Revealed"],["T6","Tonight"],["T7","Ended, not rated"]];
const SCREENS=[["home","Home"],["history","History"],["wrap","That's a wrap"],["recap","Past night"],["me","Me"]];
const S={screen:"home",state:"T7",tab:"mine",fresh:false,handoff:false,sheet:null,toast:null,rated:0,ndots:0};
const EXPLAIN={
  home:"<b>Home</b> is the phone's front page. The Tonight card has exactly one primary action, and it follows the night. Home never redirects away by itself: a new night appears on the card within 5 s with a <b>Just started</b> chip.",
  history:"<b>History</b> has two tabs. <b>Mine</b> shows what you picked, whether your pick won, and what you rated. <b>Family</b> lists every night. Tap a night to open it.",
  wrap:"<b>That's a wrap</b> is the latest night, just ended. This was the staging dead end. Now it has the nav, and when another night starts the <b>live hand-off</b> card becomes the one primary action.",
  recap:"<b>Past night</b> is an older night opened from History: your picks, the family's picks, who came and the photos. It's for browsing, so there's no primary unless a night is live.",
  me:"<b>Me</b>: your picture and name, stats, and this phone. <b>Switch person</b> opens the existing switch sheet; every switch still asks for that person's PIN (ADR-0014). <b>Change picture</b> needs backend gap G10."
};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const av=(p,cls="av")=>`<span class="${cls}" style="background:${p.color}">${p.emoji}</span>`;
const live=()=>!["T0","T7"].includes(S.state);
const icon={
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>',
  me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>'};

function here(n=6,voted=null){return `<div class="here"><span class="avs">${FAMILY.slice(0,n).map(p=>`<span style="background:${p.color}">${p.emoji}</span>`).join("")}</span><span aria-live="polite">${voted===null?`${n} here`:`<b style="color:var(--fg)">${voted} of ${n}</b> voted`}</span></div>`}
function eyebrow(text){return `<div class="eyebrow"><span class="live"><i></i>${text}</span>${S.fresh?'<span class="chip">Just started</span>':""}</div>`}

function tonightCard(){
  const st=S.state;
  const P=(label,act="go")=>`<button class="btn primary" data-testid="primary-action" data-act="${act}">${label}</button>`;
  const winner=`<div class="row"><span class="poster p4">Wall-E</span><div style="display:flex;flex-direction:column;gap:6px"><h3 style="font-size:20px">Wall-E</h3><p class="sub">Won with 4 of 6 first picks</p></div></div>`;
  switch(st){
    case "T0":return `<div class="card tonight wait" data-testid="tonight-card" data-state="T0"><div class="eyebrow">Tonight</div><div class="row"><span class="clap">🎬</span><div data-testid="waiting" style="display:flex;flex-direction:column;gap:6px"><h3 style="font-size:20px">No movie night yet</h3><p class="sub" aria-live="polite">When the host starts one, it shows up right here.</p></div></div></div>`;
    case "T1":return `<div class="card tonight" data-state="T1">${eyebrow("Starting")}<div class="row"><span class="clap">🎬</span><div style="display:flex;flex-direction:column;gap:6px"><h3 style="font-size:20px">Movie night is starting</h3><p class="sub">The host is picking movies (4 so far).</p></div></div>${P("Open movie night")}</div>`;
    case "T2":return `<div class="card tonight" data-state="T2">${eyebrow("Voting open")}<h3 style="font-size:22px">Voting is open!</h3><p class="sub">Pick your favourites from 6 movies.</p>${here(6,3)}${P("Vote now")}</div>`;
    case "T3":return `<div class="card tonight" data-state="T3">${eyebrow("Voting open")}<h3 style="font-size:22px">Your picks are in</h3><p class="sub"><b style="color:var(--fg)">Lulu</b> on this phone still needs to vote.</p>${here(6,4)}${P("Pass to next person","switch")}</div>`;
    case "T4":return `<div class="card tonight wait" data-state="T4">${eyebrow("Voting open")}<div data-testid="waiting" style="display:flex;flex-direction:column;gap:10px"><h3 style="font-size:22px">Your picks are in</h3><p class="sub" aria-live="polite"><b style="color:var(--fg)">5 of 6</b> voted. The winner shows up here.</p>${here(6,5)}</div><button class="btn sm">Change my picks</button></div>`;
    case "T5":return `<div class="card tonight" data-state="T5">${eyebrow("Winner in")}<p class="sub">Tonight's movie is…</p>${winner}${P("See the winner")}</div>`;
    case "T6":return `<div class="card tonight" data-state="T6">${eyebrow("Tonight")}${winner}<p class="sub">Snap the couch crew, the snacks, the screen.</p>${P("Add photos")}<button class="btn">Already watched? Rate it</button></div>`;
    case "T7":return `<div class="card tonight" data-state="T7"><div class="eyebrow">Last night</div><div class="row"><span class="poster p3">Paddington 2</span><div style="display:flex;flex-direction:column;gap:6px"><h3 style="font-size:20px">How was <em>Paddington 2</em>?</h3><p class="sub">Fri, Oct 17 · 4 of 6 rated</p></div></div>${P("Rate it","rate")}<button class="link" data-act="notnow" style="color:var(--mfg)">Not now</button></div>`;
  }
}
function nightRow(n,mine){
  const facts=mine?[
    `<span class="f">Your picks: ${n.picks.join(", ")}</span>`,
    n.won?'<span class="f won">🏆 Your pick won</span>':"",
    n.rated?`<span class="f">You rated ★${n.rated}</span>`:'<span class="f rate">Rate it</span>',
    n.photos?`<span class="f">📷 ${n.photos}</span>`:""]:[
    `<span class="f">${n.turnout} voted</span>`,`<span class="f">★ ${n.avg} family</span>`,n.photos?`<span class="f">📷 ${n.photos}</span>`:""];
  return `<li><button class="night" data-open="${n.id}"><span class="poster ${n.p}">${esc(n.title)}</span><span class="b"><span class="t">${esc(n.title)}</span><small>${n.date}</small><span class="facts">${facts.join("")}</span></span></button></li>`;
}
function handoff(asPrimary=true){
  if(!live())return "";
  const msg={T1:"A new movie night is starting.",T2:"Voting is open for tonight's movie night!",T3:"Voting is open for tonight's movie night!",T4:"Voting is open for tonight's movie night!",T5:"Tonight's winner is in.",T6:"Tonight's movie: <b>Wall-E</b>"}[S.state];
  return `<div class="handoff" data-testid="live-handoff" role="status"><div class="row"><span class="clap" style="font-size:18px">🎬</span><p style="margin:0;font-weight:500;line-height:1.35">${msg}</p></div><button class="btn primary" ${asPrimary?'data-testid="primary-action"':""} data-act="go">Go to tonight's movie night</button></div>`;
}
function screenHome(){
  return `<h2>Hi, ${ME.name}</h2>${tonightCard()}
  <section style="display:flex;flex-direction:column;gap:10px"><div class="sec"><h3>My recent nights</h3><button class="link" data-go="history">See all my nights</button></div><ul class="list">${NIGHTS.slice(0,3).map(n=>nightRow(n,true)).join("")}</ul></section>
  <section style="display:flex;flex-direction:column;gap:10px"><h3>Family photos from <em>Paddington 2</em></h3><div class="photos">${["p1","p3","p5","p2"].map(c=>`<span class="${c}"></span>`).join("")}</div></section>`;
}
function screenHistory(){
  const mine=S.tab==="mine";
  return `${handoff()}<h2>History</h2><div class="tabs" role="tablist"><button role="tab" aria-selected="${mine}" data-tab="mine">Mine</button><button role="tab" aria-selected="${!mine}" data-tab="family">Family</button></div>
  ${mine?'<p class="sub"><b style="color:var(--fg)">12</b> nights · <b style="color:var(--fg)">5</b> winning picks · ★ <b style="color:var(--fg)">4.3</b> average</p>':'<p class="sub">Every movie night The Baez Family has had.</p>'}
  <ul class="list">${NIGHTS.map(n=>nightRow(n,mine)).join("")}</ul>`;
}
function stars(){return `<div class="stars" role="group" aria-label="Your rating" ${!live()&&!S.rated?'data-testid="primary-action"':""}>${[1,2,3,4,5].map(i=>`<button data-star="${i}" class="${i<=S.rated?"on":""}" aria-label="${i} stars">★</button>`).join("")}</div>`}
function results(open){return `<div class="res">${[["Paddington 2",4,true],["Wall-E",3],["Coco",2],["Moana",1]].map(([t,v,w])=>`<div class="bar ${w?"win":""}"><span>${t}</span><i><b style="width:${v*25}%"></b></i><em>${v}</em></div>`).join("")}</div>`}
function screenWrap(){
  const primaryHome=!live()&&S.rated;
  return `${handoff()}<div><h2>That's a wrap</h2><p class="sub" style="margin-top:6px">Thanks for movie night.</p></div>
  <div class="row"><span class="poster p3">Paddington 2</span><div style="display:flex;flex-direction:column;gap:6px"><h3 style="font-size:18px">Paddington 2</h3><p class="sub">Fri, Oct 17 · 6 voted</p></div></div>
  <section style="display:flex;flex-direction:column;gap:10px"><h3>How was <em>Paddington 2</em>?</h3>${stars()}${S.rated?`<p class="sub" role="status">Thanks! You gave it ${S.rated} of 5.</p>`:""}</section>
  ${primaryHome?'<button class="btn primary" data-testid="primary-action" data-go="home">Back to Home</button>':""}
  <section style="display:flex;flex-direction:column;gap:10px"><h3>The family's picks</h3>${results()}</section>
  <section style="display:flex;flex-direction:column;gap:10px"><div class="sec"><h3>Photos</h3><button class="link">See all</button></div><div class="photos">${["p1","p3","p5","p2"].map(c=>`<span class="${c}"></span>`).join("")}</div><button class="btn">Add photos</button></section>`;
}
function screenRecap(){
  return `${handoff()}<div><p class="sub">Fri, Oct 10</p><h2>Spirited Away</h2></div>
  <div class="row"><span class="poster p1">Spirited Away</span><div style="display:flex;flex-direction:column;gap:6px"><p class="sub">Won with 3 of 5 first picks</p><p class="sub">★ 4.8 from the family</p></div></div>
  <section class="card"><h3>Your night</h3><p class="sub">Your picks: 1. Moana · <b style="color:var(--cinema)">2. Spirited Away 🏆</b> · 3. Up</p><div class="hr"></div><p class="sub">You rated it</p><div class="stars">${[1,2,3,4,5].map(i=>`<button class="on" aria-label="${i} stars">★</button>`).join("")}</div></section>
  <section style="display:flex;flex-direction:column;gap:10px"><h3>Who came</h3>${here(5)}</section>
  <section style="display:flex;flex-direction:column;gap:10px"><h3>The family's picks</h3>${results()}</section>
  <section style="display:flex;flex-direction:column;gap:10px"><h3>Photos</h3><div class="photos">${["p4","p2","p1"].map(c=>`<span class="${c}"></span>`).join("")}<span style="background:var(--muted)"></span></div><button class="btn">See all photos</button></section>`;
}
function screenMe(){
  return `${handoff()}<div style="display:flex;align-items:center;gap:16px"><div class="big-av" style="background:${ME.color}">${ME.emoji}<button aria-label="Change picture" data-act="picture">✎</button></div><div style="display:flex;flex-direction:column;gap:4px"><h2>${ME.name}</h2><p class="sub">Family since March 2026</p></div></div>
  <button class="btn">Change my name</button><p class="sub" style="margin-top:-10px;font-size:13px">You can change your name once. After that, ask the family admin.</p>
  <dl class="stats" style="margin:0"><div><dt>Movie nights</dt><dd>12</dd></div><div><dt>Winning picks</dt><dd>5</dd></div><div><dt>Average rating</dt><dd>4.3</dd></div><div><dt>Photos</dt><dd>21</dd></div></dl>
  <button class="link" data-go="history">See my nights</button>
  <section style="display:flex;flex-direction:column;gap:10px"><h3>This phone</h3><p class="sub">Also on this phone: Lulu</p><button class="btn" data-act="switch">Switch person</button><button class="link" data-act="add">Add someone to this phone</button></section>
  <button class="btn">Change my PIN</button>
  <button class="link" style="color:var(--mfg)">Hosting tonight? Sign in</button>`;
}
function sheet(){
  if(S.sheet==="switch")return `<div class="scrim" data-close><div class="sheet" role="dialog" aria-label="Who's voting now?"><h3 style="font-size:20px">Who's using this phone?</h3><div class="tiles"><div class="tile cur">${av(ME)}RooDog<small>That's you</small></div><button class="tile" data-act="pin">${av(FAMILY[3])}Lulu<small>${["T2","T3"].includes(S.state)?"Hasn't voted":"&nbsp;"}</small></button><button class="tile" data-act="add">＋<span>Add someone</span></button></div><p class="sub" style="font-size:13px">Every switch asks for that person's PIN.</p><button class="btn" data-close>Close</button></div></div>`;
  if(S.sheet==="pin")return `<div class="scrim"><div class="sheet" role="dialog" aria-label="Switch PIN"><div style="display:flex;align-items:center;gap:10px">${av(FAMILY[3])}<h3 style="font-size:18px">Switch to Lulu? Type their PIN.</h3></div><p class="sub" style="font-size:13px">Still set to <b style="color:var(--fg)">RooDog</b> until the PIN is right.</p><div class="dots">${[0,1,2,3,4,5].map(i=>`<i class="${i<S.ndots?"on":""}"></i>`).join("")}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,"⌫",0,"Clear"].map(k=>`<button data-key="${k}">${k}</button>`).join("")}</div><button class="btn" data-sheet="switch">Back</button></div></div>`;
  if(S.sheet==="picture")return `<div class="scrim" data-close><div class="sheet" role="dialog" aria-label="Change picture"><h3 style="font-size:20px">Pick a picture</h3><div class="tiles" style="grid-template-columns:repeat(4,1fr)">${["🦊","🐙","🦖","🐼","🚀","⚽","🎮","🌈"].map(e=>`<button class="tile" style="min-height:64px;font-size:26px" data-emoji="${e}">${e}</button>`).join("")}</div><p class="sub" style="font-size:13px">Needs backend gap G10. Hidden until it ships.</p><button class="btn" data-close>Close</button></div></div>`;
  return "";
}
function render(){
  const sub=S.screen!=="home";
  const backTo={history:"home",wrap:"history",recap:"history",me:"home"}[S.screen];
  const body={home:screenHome,history:screenHistory,wrap:screenWrap,recap:screenRecap,me:screenMe}[S.screen]();
  const navActive=S.screen==="me"?"me":S.screen==="home"?"home":"history";
  $("#phone").innerHTML=`<header class="appbar">${sub?`<button class="back" aria-label="Back" data-go="${backTo}">‹</button>`:""}<b>The Baez Family</b><button class="who" data-act="switch" aria-label="Switch person (now RooDog)">${av(ME)}${ME.name} ▾</button></header>
  <main class="main" data-screen="${S.screen}">${body}</main>
  <nav class="nav" aria-label="Main" data-testid="bottom-nav">${["home","history","me"].map(k=>`<button data-go="${k}" ${navActive===k?'aria-current="page"':""}>${icon[k]}${k[0].toUpperCase()+k.slice(1)}${k==="home"&&live()?'<span class="dot" aria-label="Movie night is on"></span>':""}</button>`).join("")}</nav>
  ${sheet()}${S.toast?`<div class="toast" role="status">${S.toast}</div>`:""}`;
  $("#screens").innerHTML=SCREENS.map(([k,l])=>`<button aria-pressed="${S.screen===k}" data-screen-pick="${k}">${l}</button>`).join("");
  $("#states").innerHTML=STATES.map(([k,l])=>`<button aria-pressed="${S.state===k}" data-state-pick="${k}">${l}</button>`).join("");
  $("#explain").innerHTML=EXPLAIN[S.screen]+(S.screen==="home"?`<br><br>Tonight state <code>${S.state}</code>: ${STATES.find(s=>s[0]===S.state)[1]}.`:"");
}
function toast(t){S.toast=t;render();setTimeout(()=>{S.toast=null;render()},2600)}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-close]");if(!t)return;
  const d=t.dataset;
  if(d.screenPick){S.screen=d.screenPick;S.sheet=null}
  else if(d.statePick){S.state=d.statePick;S.fresh=false}
  else if(d.go){S.screen=d.go;S.sheet=null}
  else if(d.tab){S.tab=d.tab}
  else if(d.open){S.screen=d.open==="n5"?"wrap":"recap"}
  else if(d.star){S.rated=+d.star}
  else if(d.sheet){S.sheet=d.sheet}
  else if(d.emoji){ME.emoji=d.emoji;S.sheet=null;toast("Picture saved.");return}
  else if(d.key!==undefined){if(d.key==="⌫")S.ndots=Math.max(0,S.ndots-1);else if(d.key==="Clear")S.ndots=0;else S.ndots++;
    if(S.ndots>=6){S.ndots=0;S.sheet=null;toast("Now set to Lulu. In the app this goes to Lulu's ballot (an arrival).");return}}
  else if(d.act==="switch"){S.sheet="switch"}
  else if(d.act==="pin"){S.sheet="pin";S.ndots=0}
  else if(d.act==="picture"){S.sheet="picture"}
  else if(d.act==="add"){S.sheet=null;toast("Goes to Who's watching? to add someone.");return}
  else if(d.act==="rate"){S.screen="wrap"}
  else if(d.act==="notnow"){S.state="T0"}
  else if(d.act==="go"){toast(S.state==="T6"?"Opens Tonight: Add photos (S13).":"Opens the movie night screen (/s/…).");return}
  else if(t.id==="simulate"){
    S.state="T0";S.fresh=false;S.sheet=null;render();
    setTimeout(()=>{S.state="T2";S.fresh=true;render();try{navigator.vibrate&&navigator.vibrate(40)}catch(_){}},1500);return}
  else if("close" in d && e.target===t){S.sheet=null}
  else return;
  render();
});
render();
</script>
