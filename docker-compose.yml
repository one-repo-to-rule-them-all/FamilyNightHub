# LOCAL DEVELOPMENT AND CI E2E ONLY (ADR-0001: the stack CI runs Playwright against is
# this one). Deployed images come from backend/Dockerfile and frontend/Dockerfile.
# Shape copied from OrderUp docker-compose.yml @ 2f86cd8 (bind-mounted source, issue #81).
#
# Services still to land in later PRs: web.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fnh
      POSTGRES_PASSWORD: fnh
      POSTGRES_DB: fnh_dev
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnh -d fnh_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Stands in for Tigris: both speak the S3 API, incl. presigned PUT/GET (02-environments.md).
  # SeaweedFS rather than MinIO: MinIO stopped publishing community images in 2025.
  # Dev-only credentials live in infra/seaweedfs/s3.json.
  s3:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "58333:8333"
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Catches magic-link email locally; UI on http://localhost:58025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "51025:1025"
      - "58025:8025"

  # Stands in for TMDB v3 (02-environments.md): fixtures for /search/movie and /movie/{id}.
  # Runs from the api image with the fake's source bind-mounted; never the real API.
  tmdb-fake:
    build:
      context: ./backend
    environment:
      PYTHONPATH: /app
    volumes:
      - ./backend/tmdb_fake:/app/tmdb_fake:ro
    command: ["uvicorn", "tmdb_fake.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "58100:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://fnh_app:fnh_app@db:5432/fnh_dev
      MIGRATION_DATABASE_URL: postgresql+psycopg2://fnh:fnh@db:5432/fnh_dev
      REDIS_URL: redis://redis:6379/0
      # Magic links land in MailHog: http://localhost:58025
      EMAIL_MODE: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      # Any token works against the fake; the real one is a fly secret (api only).
      TMDB_BASE_URL: http://tmdb-fake:8000
      TMDB_READ_TOKEN: dev-fake-tmdb-token
      # The API reaches SeaweedFS inside the network; phones get URLs signed for localhost.
      STORAGE_ENDPOINT: http://s3:8333
      STORAGE_PUBLIC_ENDPOINT: http://localhost:58333
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/tests:/app/tests
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      tmdb-fake:
        condition: service_healthy

  # ARQ worker (06-background-worker.md): same image as api, different command. Redis DB 0
  # like api, mirroring Upstash (DB 0 only; ARQ keys live under the `arq:` prefix).
  worker:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://fnh_app:fnh_app@db:5432/fnh_dev
      REDIS_URL: redis://redis:6379/0
      EMAIL_MODE: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      # The orphan-upload sweep deletes from the photos bucket (keys come from .env).
      STORAGE_ENDPOINT: http://s3:8333
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    command: ["python", "-m", "app.workers.main"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The tables it reads exist only after `alembic upgrade head`, which runs in api.
      api:
        condition: service_started

volumes:
  pgdata:
  s3data:
