# LOCAL DEVELOPMENT AND CI E2E ONLY (ADR-0001: the stack CI runs Playwright against is
# this one). Deployed images come from backend/Dockerfile and frontend/Dockerfile.
# Shape copied from OrderUp docker-compose.yml @ 2f86cd8 (bind-mounted source, issue #81).
#
# Services still to land in later PRs: worker (ARQ), web, tmdb-fake.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fnh
      POSTGRES_PASSWORD: fnh
      POSTGRES_DB: fnh_dev
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnh -d fnh_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Stands in for Tigris: both speak the S3 API, incl. presigned PUT/GET (02-environments.md).
  # SeaweedFS rather than MinIO: MinIO stopped publishing community images in 2025.
  # Dev-only credentials live in infra/seaweedfs/s3.json.
  s3:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "58333:8333"
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Catches magic-link email locally; UI on http://localhost:58025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "51025:1025"
      - "58025:8025"

  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://fnh_app:fnh_app@db:5432/fnh_dev
      MIGRATION_DATABASE_URL: postgresql+psycopg2://fnh:fnh@db:5432/fnh_dev
      REDIS_URL: redis://redis:6379/0
      # Magic links land in MailHog: http://localhost:58025
      EMAIL_MODE: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/tests:/app/tests
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  s3data:
