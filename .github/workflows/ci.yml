# PR gate for Family Night Hub (docs/architecture/07-cicd.md).
#
# Jobs run in parallel; branch protection should require all six:
#   static          ruff, ruff format, mypy, repo rules, actionlint, tsc, eslint, prettier
#   unit            pytest tests/unit (no data plane), vitest
#   integration     pytest everything against real Postgres + Redis as fnh_app, incl. the
#                   isolation suite and the RLS coverage test; coverage gates
#   contract        alembic upgrade + check (models == migrations), OpenAPI + api.gen.ts drift
#   bundle-secrets  next build with sentinel server secrets, then grep .next/static
#   e2e             Playwright (phone viewports + axe) against the real API and Next, on
#                   Postgres + Redis + MailHog service containers
#
# Not here yet: multi-phone/TV E2E with SSE and tmdb-fake (lands with voting).
# Deploys live in deploy.yml.
#
# Shape from OrderUp .github/workflows/ci.yml @ 2f86cd8 (service containers, role
# bootstrap before migrations, alembic check), FieldPro @ 0670961 (OpenAPI drift) and
# Ctrl+Alt+Defeat @ dcbda7d (bundle secret grep).
name: CI

on:
  # Every PR, whatever its base (stacked branches get the gate too).
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # Mirrors .env.example with the service containers port-mapped onto the runner.
  ENVIRONMENT: test
  DATABASE_URL: postgresql+asyncpg://fnh_app:fnh_app@localhost:5432/fnh_dev
  MIGRATION_DATABASE_URL: postgresql+psycopg2://fnh:fnh@localhost:5432/fnh_dev
  REDIS_URL: redis://localhost:6379/0
  OWNER_PSQL_URL: postgresql://fnh:fnh@localhost:5432/fnh_dev

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/tools/eslint/package-lock.json
      - name: uv sync
        working-directory: backend
        run: uv sync --locked
      - name: ruff check
        working-directory: backend
        run: uv run ruff check .
      - name: ruff format --check
        working-directory: backend
        run: uv run ruff format --check .
      - name: mypy (strict)
        working-directory: backend
        run: uv run mypy app scripts
      - name: Repo rules (no sleeps in tests, no session-level GUC, revision id length)
        working-directory: backend
        run: uv run python scripts/check_repo_rules.py ..
      - name: actionlint (workflow files, incl. deploy.yml)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: tsc --noEmit
        working-directory: frontend
        run: npm run typecheck
      - name: npm ci (tools/eslint, isolated for its TypeScript 5 peer)
        working-directory: frontend
        run: npm run lint:install
      - name: eslint
        working-directory: frontend
        run: npm run lint
      - name: prettier --check
        working-directory: frontend
        run: npm run format:check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - working-directory: backend
        run: uv sync --locked
      - name: pytest tests/unit
        working-directory: backend
        run: uv run pytest tests/unit -q
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: vitest
        working-directory: frontend
        run: npm test

  integration:
    name: integration (incl. isolation + RLS coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: fnh
          POSTGRES_PASSWORD: fnh
          POSTGRES_DB: fnh_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fnh -d fnh_dev"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - working-directory: backend
        run: uv sync --locked
      - name: Bootstrap fnh_app + fnh_resolver roles
        # Before migrations: it installs the default privileges that grant the app role DML
        # on tables the owner creates, and migration 0001 refuses to run without both roles.
        run: psql "$OWNER_PSQL_URL" -v ON_ERROR_STOP=1 -f backend/db/init/00-init-app-role.sql
      - name: pytest (unit + integration) with coverage
        # tests/integration/conftest.py runs `alembic upgrade head`, then every assertion
        # runs as fnh_app through the RLS path. Retries are never used to get to green.
        working-directory: backend
        run: uv run pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=70
      - name: Coverage gate — domain 100%
        working-directory: backend
        run: uv run coverage report --include="app/domain/*" --fail-under=100
      - name: Coverage gate — services 80%
        working-directory: backend
        run: uv run coverage report --include="app/services/*" --fail-under=80

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: fnh
          POSTGRES_PASSWORD: fnh
          POSTGRES_DB: fnh_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fnh -d fnh_dev"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/tools/openapi/package-lock.json
      - working-directory: backend
        run: uv sync --locked
      - run: psql "$OWNER_PSQL_URL" -v ON_ERROR_STOP=1 -f backend/db/init/00-init-app-role.sql
      - name: alembic upgrade head
        working-directory: backend
        run: uv run alembic upgrade head
      - name: alembic downgrade base, then upgrade head again
        # Expand/contract means prod never downgrades, but a broken downgrade is how a
        # migration's teardown rots unnoticed; tests and local resets rely on it.
        working-directory: backend
        run: uv run alembic downgrade base && uv run alembic upgrade head
      - name: alembic check (models match migrations)
        working-directory: backend
        run: uv run alembic check
      - name: Regenerate openapi.json and api.gen.ts
        run: |
          (cd backend && uv run python scripts/dump_openapi.py openapi.json)
          (cd frontend/tools/openapi && npm ci)
          (cd frontend && npm run gen:api)
      - name: Assert no OpenAPI drift
        run: |
          if ! git diff --exit-code -- backend/openapi.json frontend/src/types/api.gen.ts; then
            echo "::error::OpenAPI schema or generated types are out of sync. Run:"
            echo "  (cd backend && uv run python scripts/dump_openapi.py openapi.json)"
            echo "  (cd frontend && npm run gen:api)"
            exit 1
          fi

  bundle-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Sentinel values for every server-only secret in 02-environments.md. If any build
      # path ever reads one into client code, its sentinel shows up in .next/static.
      SESSION_SECRET: fnh-sentinel-session-secret-8c1f
      DEVICE_TOKEN_PEPPER: fnh-sentinel-device-pepper-2b7e
      TMDB_READ_TOKEN: fnh-sentinel-tmdb-token-5d93
      EMAIL_API_KEY: fnh-sentinel-email-key-a4c0
      SENTRY_DSN: https://fnh-sentinel-sentry-dsn@example.invalid/1
      STORAGE_ACCESS_KEY_ID: fnh-sentinel-storage-key-id-6a4b
      STORAGE_SECRET_ACCESS_KEY: fnh-sentinel-storage-secret-71e2
      BACKUP_STORAGE_SECRET_ACCESS_KEY: fnh-sentinel-backup-secret-0f9d
      DATABASE_URL: postgresql://fnh_app:fnh-sentinel-db-password-3a6b@db.invalid/fnh
      MIGRATION_DATABASE_URL: postgresql://fnh:fnh-sentinel-owner-password-9e15@db.invalid/fnh
      REDIS_URL: redis://default:fnh-sentinel-redis-password-c2d8@redis.invalid:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: next build
        working-directory: frontend
        run: npm run build
      - name: No server secret in the client bundle
        working-directory: frontend
        run: |
          printf '%s\n' "$SESSION_SECRET" "$DEVICE_TOKEN_PEPPER" "$TMDB_READ_TOKEN" \
            "$EMAIL_API_KEY" "fnh-sentinel-sentry-dsn" "$STORAGE_ACCESS_KEY_ID" "$STORAGE_SECRET_ACCESS_KEY" \
            "$BACKUP_STORAGE_SECRET_ACCESS_KEY" "fnh-sentinel-db-password-3a6b" \
            "fnh-sentinel-owner-password-9e15" "fnh-sentinel-redis-password-c2d8" \
            > "$RUNNER_TEMP/secrets.txt"
          test -d .next/static
          if grep -rFf "$RUNNER_TEMP/secrets.txt" .next/static; then
            echo "::error::A server secret was found in .next/static"; exit 1
          fi
          echo "No sentinel found in $(find .next/static -type f | wc -l) static files"

  e2e:
    name: e2e (Playwright + axe, real API)
    runs-on: ubuntu-latest
    # 25, up from 20: acceptance.spec.ts is one ~1.5-2 min journey (7 browsers, a 30s real
    # reveal settle) on top of the existing specs; the margin covers a cold runner.
    timeout-minutes: 25
    env:
      # The API under test: app role through RLS, real CSRF/cookies, magic links over SMTP to
      # MailHog. Every test seeds its own household (frontend/e2e/seed_night.py), so nothing is
      # shared between tests and retries stay at 0 (07-cicd.md).
      EMAIL_MODE: smtp
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAILHOG_URL: http://localhost:8025
      FRONTEND_BASE_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      E2E_API_PORT: "8000"
      E2E_WEB_PORT: "3000"
      # Rewrites are baked into the build, so `next build` needs it too.
      API_INTERNAL_URL: http://localhost:8000
      # Photos (ADR-0005): SeaweedFS stands in for Tigris, started below with the dev-only keys
      # from infra/seaweedfs/s3.json. Phones PUT/GET it directly, so the bucket gets a CORS rule.
      STORAGE_ENDPOINT: http://localhost:8333
      STORAGE_BUCKET: fnh-photos-e2e
      STORAGE_ACCESS_KEY_ID: fnh-dev-access
      STORAGE_SECRET_ACCESS_KEY: fnh-dev-secret
      STORAGE_REGION: us-east-1
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: fnh
          POSTGRES_PASSWORD: fnh
          POSTGRES_DB: fnh_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fnh -d fnh_dev"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: backend
        run: uv sync --locked
      - name: Bootstrap fnh_app + fnh_resolver roles
        run: psql "$OWNER_PSQL_URL" -v ON_ERROR_STOP=1 -f backend/db/init/00-init-app-role.sql
      - name: alembic upgrade head
        working-directory: backend
        run: uv run alembic upgrade head
      # A step rather than a service container: services start before checkout, so they can't
      # mount infra/seaweedfs/s3.json, and they can't take the `server -s3` command line.
      - name: Start SeaweedFS (S3)
        run: |
          docker run -d --name s3 -p 8333:8333 -p 9333:9333 \
            -v "$GITHUB_WORKSPACE/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:3.97 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          # Same readiness probe as docker-compose.yml's healthcheck.
          curl -fsS --retry 60 --retry-delay 1 --retry-all-errors -o /dev/null \
            http://localhost:9333/cluster/status
      - name: Photos bucket + CORS for the web origin
        working-directory: backend
        run: uv run python ../frontend/e2e/setup_bucket.py --origin "$FRONTEND_BASE_URL"
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: next build
        working-directory: frontend
        run: npm run build
      - name: Playwright (starts uvicorn + next start itself)
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
