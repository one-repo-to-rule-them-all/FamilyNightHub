# Layout and tooling copied from OrderUp backend/pyproject.toml @ 2f86cd8.
[project]
name = "fnh-backend"
version = "0.1.0"
description = "Family Night Hub API + worker (FastAPI, ARQ)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "structlog>=24.4",
    "redis>=5.0",
    "arq>=0.26",
    "sentry-sdk[fastapi]>=2.14",
    # TMDB client (app/integrations/tmdb.py).
    "httpx>=0.27",
    # Photos bucket (app/integrations/storage.py): sync client run via asyncio.to_thread.
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    # Pinned, not floored: ruff changes its default rule set between releases (OrderUp #160).
    "ruff==0.15.21",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Engine and Redis client are module-level singletons; one loop for the whole run (OrderUp note).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs Postgres + Redis (docker compose up -d db redis)",
    "s3: needs an S3 API (SeaweedFS); skipped unless STORAGE_TEST_ENDPOINT is set",
]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy async runs DB calls in greenlets; without this, lines that resume after an
# awaited query are reported as missed even though tests execute them.
concurrency = ["greenlet", "thread"]
